name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scientific-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m frostlens demo --case narrow --output local-reports/smoke.json
      - name: Portable StateLens without site packages
        run: python -S skills/compare-experiments/scripts/statelens.py demo --out local-reports/statelens --draws 500
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser integration
        run: |
          python -m frostlens serve > /tmp/frostlens-server.log 2>&1 &
          node tests/browser.mjs
      - name: StateLens offline report
        run: |
          python -S skills/compare-experiments/scripts/statelens.py demo --out local-reports/statelens
          node tests/statelens-browser.mjs
